<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marlowe Rose | Set Password</title>
<style>body{background:#241d1d;color:#f4e8df;font:18px Georgia,serif;padding:3rem 1rem}main{max-width:600px;margin:auto}label{display:block;margin-top:1rem}input{display:block;width:100%;box-sizing:border-box;padding:12px;margin-top:8px}button{margin-top:1rem;padding:12px;background:#b68a8f;border:0;border-radius:5px}#status{margin-top:1rem}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script></head>
<body><main><h1>Set your password</h1><p>Open this page from a fresh password recovery email.</p>
<form id="form"><label>New password<input id="password" type="password" minlength="12" autocomplete="new-password" required></label><label>Confirm password<input id="confirm" type="password" minlength="12" autocomplete="new-password" required></label><button type="submit">Save password</button></form><p id="status" role="status"></p></main>
<script>
const client=window.supabase.createClient("https://tanpkisnsffagsxulqfy.supabase.co","sb_publishable_kG8WiXK6DN-hauVJLgtlww_3BLV7i7q");
const status=document.getElementById("status");
document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault();
 const password=document.getElementById("password").value;
 if(password!==document.getElementById("confirm").value){status.textContent="Passwords do not match.";return}
 const {data:{session}}=await client.auth.getSession();
 if(!session){status.textContent="Recovery link invalid or expired. Request a fresh link.";return}
 const {error}=await client.auth.updateUser({password});
 status.textContent=error?"Unable to save password: "+error.message:"Password saved. You can now sign in on the moderation page.";
 if(!error){document.getElementById("form").reset();await client.auth.signOut();}
});
</script></body></html>
