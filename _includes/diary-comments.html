<section class="marlowe-comments" data-entry-id="{{ include.entry_id | escape }}" aria-labelledby="marlowe-comments-heading">
  <h3 id="marlowe-comments-heading">A note from you</h3>
  <p>Every story feels a little different when someone reads it. I'd love to hear your thoughts.</p>
  <div class="marlowe-comment-list" aria-live="polite">Loading comments…</div>
  <form class="marlowe-comment-form">
    <label>Your name <input name="author_name" maxlength="80" autocomplete="name" required></label>
    <label>Your comment <textarea name="comment_text" maxlength="2000" rows="4" required></textarea></label>
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAFb7GcWJoobb8HEs" data-callback="marloweCommentVerified" data-expired-callback="marloweCommentExpired"></div>
    <button type="submit">Leave a comment</button>
    <p class="marlowe-comment-status" role="status" aria-live="polite"></p>
  </form>
  <p class="marlowe-comment-privacy">Comments are public. Spam prevention uses Cloudflare Turnstile, subject to Cloudflare's privacy policy and terms. Please don't include private information.</p>
</section>
<link rel="stylesheet" href="{{ '/diary-comments.css' | relative_url }}">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="{{ '/diary-comments.js' | relative_url }}" defer></script>
