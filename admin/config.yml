backend:
  name: turbo-github
  turbo_site_id: a2795bb2-4a72-4f8c-97b5-be4941ef04c5
  branch: main

publish_mode: simple
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "diary"
    label: "Diary"
    label_singular: "Diary Entry"
    folder: "_diary"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "MMMM D, YYYY", time_format: "h:mm A", picker_utc: false }
      - { label: "Short excerpt", name: "excerpt", widget: "text", required: false, hint: "Optional. A short thought shown before the full entry." }
      - { label: "Entry", name: "body", widget: "markdown" }

  - name: "music"
    label: "Music"
    label_singular: "Release"
    folder: "_music"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Song title", name: "title", widget: "string" }
      - { label: "Release date", name: "date", widget: "datetime", date_format: "MMMM D, YYYY", time_format: false }
      - { label: "Cover filename", name: "cover", widget: "string", hint: "First upload the cover to the website assets folder in GitHub. Then enter /assets/ followed by the exact filename, for example: /assets/one-day-or-day-one.png" }
      - { label: "Featured / latest release", name: "featured", widget: "boolean", default: false, hint: "Turn this on for the song that should get the large featured treatment." }
      - { label: "Short description", name: "description", widget: "text", required: false }
      - { label: "HyperFollow / presave link", name: "presave_url", widget: "string", required: false, hint: "Paste the DistroKid HyperFollow or presave link here." }
      - { label: "Spotify link", name: "spotify_url", widget: "string", required: false, hint: "After release, paste the Spotify song link here." }
      - { label: "Apple Music link", name: "apple_url", widget: "string", required: false, hint: "After release, paste the Apple Music song link here." }
      - { label: "Amazon Music link", name: "amazon_url", widget: "string", required: false, hint: "After release, paste the Amazon Music song link here." }
      - { label: "Diary story link", name: "diary_url", widget: "string", required: false, hint: "Optional. Paste the website link to the diary page behind this song." }


  - name: "photos"
    label: "Photos"
    label_singular: "Photo"
    folder: "_photos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    media_folder: "/assets/photos"
    public_folder: "/assets/photos"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "A short name for the photo. This can be simple, like Backstage or Sunday Morning." }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "MMMM D, YYYY", time_format: "h:mm A", picker_utc: false }
      - { label: "Photo", name: "image", widget: "image", choose_url: false, media_library: { config: { multiple: false } } }
      - { label: "Caption", name: "caption", widget: "text", required: false, hint: "Optional. Add a few words to go with the photo." }
