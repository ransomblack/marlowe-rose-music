name: Diary announcement preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_diary/**'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate diary email preview (no email sent)
        run: python3 scripts/preview_diary_email.py
      - name: Save email preview for review
        uses: actions/upload-artifact@v4
        with:
          name: diary-email-preview
          path: diary-email-preview/
          retention-days: 14
