name: Sender connection test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Sender API credentials and list groups (read-only)
        env:
          SENDER_API_TOKEN: ${{ secrets.SENDER_API_TOKEN }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.error
          token = os.environ.get("SENDER_API_TOKEN", "")
          if not token:
              raise SystemExit("SENDER_API_TOKEN secret is missing")
          url = "https://api.sender.net/v2/groups"
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + token,
              "Accept": "application/json"
          }, method="GET")
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              print("Sender API returned HTTP", exc.code)
              raise SystemExit("Read-only connection test failed; check token and API permissions")
          except Exception as exc:
              raise SystemExit("Sender connection test failed: " + type(exc).__name__)
          groups = payload.get("data", []) if isinstance(payload, dict) else payload
          if not isinstance(groups, list):
              print("API responded but group list shape was unexpected")
              raise SystemExit(1)
          print("Read-only connection successful. Groups:")
          for group in groups:
              print("Name:", group.get("title", group.get("name", "(unnamed)")), "| ID:", group.get("id", "(unknown)"))
          print("No emails sent. No changes made to Sender.")
